services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - authelia

  authelia:
    image: authelia/authelia:4
    restart: unless-stopped
    volumes:
      - ./authelia:/config
    environment:
      - AUTHELIA_JWT_SECRET_FILE=/run/secrets/jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/session_secret
      - AUTHELIA_STORAGE_SQLITE_PASSWORD_FILE=/run/secrets/storage_password
    secrets:
      - jwt_secret
      - session_secret
      - storage_password
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  session_secret:
    file: ./secrets/session_secret.txt
  storage_password:
    file: ./secrets/storage_password.txt

volumes:
  caddy_data:
  caddy_config:
